services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      WEBUI_TOKEN: "${NAPCAT_WEBUI_TOKEN:-napcat}"
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - ./data/QQ:/app/.config/QQ
      - ./data/config:/app/napcat/config
      - ./data/plugins:/app/napcat/plugins
    networks:
      - yawnbot-internal

networks:
  yawnbot-internal:
    external: true
    name: yawnbot-internal
