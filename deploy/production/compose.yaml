name: yawnbot

services:
  yawnbot:
    image: "${YAWNBOT_IMAGE:?YAWNBOT_IMAGE must be an immutable digest reference}"
    restart: unless-stopped
    # 应用配置由入口脚本每次启动时从 config/.env 加载（WebUI 环境配置页写的就是它），
    # 不经 env_file 注入，否则面板改动重启后不生效且全部显示为外部覆盖。
    env_file:
      - onebot.env
    # 宿主 config/ 属于部署用户组（setgid 2770），容器以该组身份读写配置文件
    group_add:
      - "${YAWNBOT_CONFIG_GID:-10001}"
    environment:
      YAWNBOT_ENV_FILE: /app/config/.env
      HOST: 0.0.0.0
      PORT: 8080
      LOCALSTORE_USE_CWD: "true"
      YAWNBOT_AUTO_MIGRATE: "false"
      FANQIE_BROWSER_WS_ENDPOINT: "${FANQIE_BROWSER_WS_ENDPOINT:-}"
      YAWNBOT_PINNED_ENV_KEYS: HOST,PORT,LOCALSTORE_USE_CWD,YAWNBOT_AUTO_MIGRATE,FANQIE_BROWSER_WS_ENDPOINT
    ports:
      - "127.0.0.1:${YAWNBOT_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - sandbox-run:/run/yawnbot-sandbox
    networks:
      - yawnbot-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Agent 代码沙箱：同一个镜像，单独跑 runner。没有网络、只读根文件系统、
  # 丢掉几乎所有 capability；只挂载自己的工作区和与 Bot 共享的 socket 目录，
  # 拿不到 Bot 的 .env、数据库和 OneBot 凭据。以 root 启动是为了给每个群
  # 降权到独立 uid（runner 自检不通过时会拒绝执行）。
  sandbox:
    image: "${YAWNBOT_IMAGE:?YAWNBOT_IMAGE must be an immutable digest reference}"
    restart: unless-stopped
    user: "0:0"
    # tini 回收用户代码留下的孤儿/僵尸进程，否则它们会占满该群的进程配额。
    init: true
    entrypoint: ["python3", "-s", "-m", "yawn_sandbox"]
    command: ["serve"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    environment:
      PYTHONPATH: /opt/yawnbot-sandbox/runner
      SANDBOX_SOCKET_GID: "10001"
      SANDBOX_REQUIRE_ISOLATION: "true"
    volumes:
      - ./sandbox:/var/lib/yawnbot-sandbox
      - sandbox-run:/run/yawnbot-sandbox
    healthcheck:
      test: ["CMD", "python3", "-s", "-m", "yawn_sandbox", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  playwright:
    image: "${YAWNBOT_BROWSER_IMAGE:-busybox:1.36}"
    profiles:
      - fanqie-browser
    restart: unless-stopped
    init: true
    shm_size: "512m"
    networks:
      - yawnbot-internal

  # 公网 WebUI 入口：deploy-release 默认启动，服务器存在
  # /opt/yawnbot/public-https.disabled 时停止。
  # 8080 仍只绑回环地址，公网只经 Caddy 的 80/443 进入并自动签发 HTTPS 证书。
  caddy:
    image: "caddy:2.8.4-alpine"
    profiles:
      - public-https
    restart: unless-stopped
    environment:
      YAWNBOT_PUBLIC_DOMAIN: "bot.yawnelle.xyz"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - exec caddy reverse-proxy --from "$$YAWNBOT_PUBLIC_DOMAIN" --to yawnbot:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - yawnbot-internal

volumes:
  sandbox-run:

networks:
  yawnbot-internal:
    external: true
    name: yawnbot-internal
