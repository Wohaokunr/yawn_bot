      未央已经学会听见自己的愿望，并决定搭乘眼前这班列车。玩家可以舍不得，
      但不得把支持远行说成唯一正确答案。她的离开是自己的选择。
    text: |
      ═══ 结局 · 潮声之外 ═══
      未央看着已经开启的车门，最后说：「我还是想去。现在就想去。」
      她允许你们舍不得，也坦率承认自己会为这份不舍感到高兴。
      星灯被她抱进车厢。列车驶出风待町时，那点温柔的光一直亮在窗边。
  - id: lanterns_tonight
    condition: scene:station_platform & flag:voice_choose_route & flag:voice_dream & flag:voice_original_wish & flag:voice_honest & flag:final_stay
    name: 今夜的星灯
    outcome: good
    summary: |
      未央确认小镇能继续运转，也没有受到玩家挽留。她只因自己想看完星灯祭而退出车门，
      并主动改乘三天后的列车。这不是放弃远方，而是第一次由自己安排人生。
    text: |
      ═══ 结局 · 今夜的星灯 ═══
      车门即将关闭时，未央忽然抱着星灯退回月台。
      「我今天还没看完星灯祭。」她望着远去的尾灯，笑得像刚做了一件不得了的坏事。
      「三天后的车，我会搭那班。至于现在——快一点，我第一次为自己改行程，得玩得值一点吧？」
      她抓住离自己最近的那只手，朝正在亮起的祭典跑去。
  - id: borrowed_departure
    condition: scene:station_platform & flag:final_departure
    name: 借来的勇敢
    outcome: neutral
    summary: 未央在尚未听清自己愿望时接受了出发这一答案；她去了远方，却仍把决定是否正确交给别人评判。
    text: |
      ═══ 结局 · 借来的勇敢 ═══
      未央登上了列车。她向所有人挥手，笑容与平日没有区别。
      只是直到车窗离开月台，她仍在观察你们的表情，像在确认自己是否给出了大家期待的答案。
  - id: requested_stay
    condition: scene:station_platform & flag:final_stay
    name: 被请求的停留
    outcome: neutral
    summary: 未央留下了，但理由仍与他人的期待纠缠。这个结局不宣判选择错误，只保留未来可能后悔的余味。
    text: |
      ═══ 结局 · 被请求的停留 ═══
      列车离开后，未央仍站在月台上。她笑着说自己本来也有一点想留下。
      星灯在怀里亮着，可她没有提起下一班车，也没有人知道这个决定究竟有多少属于她自己。
  - id: correct_answer
    condition: scene:station_platform & flag:final_imposed
    name: 正确答案
    outcome: bad
    summary: 玩家以爱、责任或正确为名替未央决定。无论去留，她再次成为回应他人期待的人。
    text: |
      ═══ 结局 · 正确答案 ═══
      未央最终照着你们给出的理由作了选择。
      她仍然温柔地向每个人道谢，却没有再问自己想去哪里。那盏被赠予的星灯，整晚都没有真正亮起来。
  - id: all_fallen
    condition: all_players_incapped
    name: 星灯未明
    outcome: bad
    summary: 全员失去行动能力时触发，优先于系统通用全灭结局。
    text: |
      ═══ 结局 · 星灯未明 ═══
      混乱迫使祭典提前结束。未央留在广场照看受伤的人，直到列车的灯从海岸尽头消失。
  - id: missed_in_tasks
    condition: time_after:20:00
    name: 塞满的一天
    outcome: neutral
    summary: 时间耗尽时触发。未央再次让许多小小的善意占满行程，没能在车门关闭前面对自己的选择。
    text: |
      ═══ 结局 · 塞满的一天 ═══
      当众人终于想起车票，远处只剩列车消失后的轨道声。
      未央低头数了数今天完成的委托，又把手偷偷藏到背后：「……没有很多啦。」
      祭典依旧亮起，而那张没有使用的车票被她重新夹回星图册里。

events:
  - id: volunteers_arrive
    name: 海风中的初遇
    summary: 外地志愿者抵达风待町，未央负责接待。用轻快的追纸片场面让玩家自然认识她。
  - id: ticket_seen
    name: 车票显露
    condition: clue:capital_ticket
    summary: 玩家得知未央将在今晚离开。不要把赶上列车明示为胜利条件，只持续提醒时间。
  - id: cake_is_gift
    name: 不是订单的蛋糕
    condition: clue:farewell_cake
    summary: 柚子的蛋糕是告别礼物。可让未央记住不同玩家随口提过的口味，建立各自不同的私人联系。
  - id: dream_has_history
    name: 写了很多年的远方
    condition: clue:annotated_star_map
    summary: 星图证明未央对远方的向往持续多年。故乡与远方都是真实愿望，不要把两者写成善恶对立。
  - id: scope_relit
    name: 星路重明
    condition: clue:lit_star_route
    summary: 朔能独立维护观星仪。不要让他发表成长演说，只用熟练动作和简短回答表现。
  - id: lantern_promise
    name: 最后的小委托
    condition: clue:akari_lantern
    summary: 灯里的星灯从委托转为礼物，为月台上的自由去留准备视觉意象。
  - id: own_voice_heard
    name: 自己的声音
    condition: flag:voice_choose_route & flag:voice_dream & flag:voice_original_wish & flag:voice_honest
    summary: |
      玩家多次询问未央自己的愿望，并表达感情而不索取答案。此事件解锁同等级的自由出发与自由留下；
      KP 不替她裁决哪条更正确，只根据此前互动选择当下更符合她心意的一条。
  - id: festival_secured
    name: 今天没有你的工作了
    condition: clue:festival_safe
    summary: |
      搬运车已停下。柚子搬灯箱、朔调设备、绫乃指挥人群，大家自然接走未央手里的事情，不批评她。
      灯里把修好的星灯送给她，并明确说这次不是请求。
  - id: last_train_nears
    name: 末班车将至
    condition: time_after:19:30
    summary: 列车即将进站。提醒时间，但不要暗示搭车才是胜利。
