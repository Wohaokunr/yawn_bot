# 青春轻小说模组《潮声停靠之前》：外地志愿者在星灯祭当天陪伴一名即将远行的少女。
# 真结局不判断她上车还是留下，只判断她能否用自己的愿望作出选择。

id: before_tide_departs
name: 潮声停靠之前
description: 星灯祭的外地志愿者陪汐见未央走完离镇前的一天，并在末班车前听见她真正的愿望。
min_players: 2
max_players: 5
difficulty: 剧情向

time:
  start: "14:00"
  costs:
    say: 2
    talk: 4
    check: 5
    move: 5
    attack: 3
    wait: 0
generic_endings: true

opening: |
  星灯祭当日，驶入风待町的列车带来海风，也带来了临时支援祭典的你们。
  站前广场上，接待志愿者的少女刚举起名册，一阵风便把纸页和星灯纸吹得到处都是。
  她追着纸片跑出几步，又回头朝你们笑：「欢迎来到风待町！那个……能先帮我抓住它们吗？」

start_scene: station_square

scenes:
  - id: station_square
    name: 站前广场
    narration: |
      白色站房前悬满尚未点亮的星灯，远处海面闪着午后的碎光。
      汐见未央一边整理被风吹乱的名册，一边向每个人认真道歉，仿佛海风也是她招来的。
      她怀里的星图册没有合紧，一张通往王都的车票露出浅蓝色的边角。
    idle_narration: 海风再次掀动纸页，未央赶紧用手肘压住名册。
    checks:
      - id: station_team_pages
        skill: spot_hidden
        difficulty: regular
        mode: team
        required_successes: 2
        triggers: [纸片, 名册, 星灯纸, 帮忙, 捡]
        once: true
        success_text: 众人沿着风向分头行动，很快便把散落的纸页完整地收了回来。
        failure_text: 最后一张名册钻进长椅底下，众人忙乱了一阵才总算把它够出来。
        clue: volunteer_list
      - id: station_ticket_notice
        skill: spot_hidden
        difficulty: regular
        triggers: [车票, 星图册, 王都, 行李]
        once: true
        success_text: 你注意到星图册里夹着一张尚未使用的远行车票，日期正是今天。
        failure_text: 未央很快合上星图册，只留下一个浅蓝色的纸角从书页间一闪而过。
        clue: capital_ticket
    exits:
      - to_scene: bakery
        keywords: [面包店, 商店街, 柚子]
        narration: 未央领着你们穿过挂满星灯的商店街，脚步轻快得像今天永远不会结束。

  - id: bakery
    name: 潮风面包店
    narration: |
      店里满是柠檬皮与刚出炉面包的香气，柜台后却飘着一缕不太妙的白烟。
      榛名柚子抱着一只歪斜的蛋糕盒，坚称这只是一次非常普通的试作失败。
      未央已经卷起袖口，嘴里说着「顺手而已」，自然地走向罢工的烤炉。
    idle_narration: 烤炉发出不服气似的轻响，柚子与它隔着柜台互相瞪着。
    checks:
      - id: bakery_oven_team
        skill: elec_repair
        difficulty: regular
        mode: team
        required_successes: 2
        triggers: [烤炉, 电路, 修理, 白烟, 开关]
        once: true
        success_text: 众人找出松脱的接点，柚子亲手合上外壳，烤炉终于重新亮起温暖的火光。
        failure_text: 烤炉勉强恢复了工作，却仍不时发出令人担心的咳嗽声。
        clue: farewell_cake
      - id: bakery_recipe
        skill: library
        difficulty: regular
        triggers: [配方, 订单, 蛋糕, 柠檬, 账本]
        once: true
        success_text: 订单簿上没有客人的名字，只有一行被反复涂改的盐花柠檬蛋糕配方。
        failure_text: 账本里挤满柚子的速记，只有几处柠檬汁留下的圆形水痕格外显眼。
        clue: farewell_recipe
    exits:
      - to_scene: station_square
        keywords: [车站, 站前]
        narration: 你们重新回到海风穿行的站前街道。
      - to_scene: old_library
        keywords: [图书馆, 海岬, 久世]
        narration: 未央接过柚子塞来的纸袋，又想替她收拾柜台，被众人一起推向了门外。

  - id: old_library
    name: 海岬旧图书馆
    narration: |
      旧图书馆坐落在面向海岬的坡顶，木窗被海风磨得发白。
      久世征一从高高的书架后探出头，递给未央一本边角卷起的星图册。
      册中密密麻麻的批注一路指向王都，也指向许多她从未亲眼见过的天空。
    idle_narration: 书页被海风轻轻掀起，远方的潮声像藏在纸张之间。
    checks:
      - id: library_star_map
        skill: library
        difficulty: regular
        triggers: [星图, 批注, 借阅, 王都, 书架]
        once: true
        success_text: 众人按批注找到一叠旧练习图，每一张都比前一张更接近遥远而陌生的天空。
        failure_text: 书架间的编号已经褪色，只能看出未央曾在这里停留过许多个午后。
        clue: annotated_star_map
      - id: library_window_listen
        skill: listen
        difficulty: regular
        triggers: [窗边, 海声, 风铃, 久世, 低声]
        once: true
        success_text: 你听见久世先生低声说，真正想去远方的人，谈起陌生天空时声音会变得不一样。
        failure_text: 风铃盖住了久世先生后半句话，他只是看着未央，露出理解的微笑。
    exits:
      - to_scene: bakery
        keywords: [面包店, 商店街]
        narration: 你们沿坡道返回商店街，纸袋里的甜香一路跟着海风。
      - to_scene: school_rooftop
        keywords: [学校, 天台, 天文社, 观星仪]
        narration: 未央抱紧星图册，沿着通往学校的长坡小跑起来。

  - id: school_rooftop
    name: 学校天台
    narration: |
      天台上的观星仪披着防尘布，支架旁散着工具和被风吹乱的校准卡。
      冬木朔已经拆开了传动箱，却在听见脚步时立刻站直，假装自己只是刚刚开始。
      未央下意识伸手去拿扳手，朔却先一步把它握在了手里。
    idle_narration: 风吹过观星仪的金属支架，发出清亮而短促的回声。
    checks:
      - id: rooftop_scope_team
        skill: mech_repair
        difficulty: regular
        mode: team
        required_successes: 2
        triggers: [观星仪, 传动箱, 校准, 扳手, 修理]
        once: true
        success_text: 朔依照未央留下的笔记完成最后校准，观星仪缓缓转向她将要前往的天空。
        failure_text: 齿轮仍有轻微偏差，但朔把问题一项项记下，决定由自己继续修完。
        clue: lit_star_route
      - id: rooftop_lens_cover
        skill: climb
        difficulty: regular
        triggers: [镜片罩, 屋檐, 风吹, 爬, 取回]
        once: true
        success_text: 你稳稳取回挂在屋檐边的镜片罩，未央在下面伸着手，紧张得忘了呼吸。
        failure_text: 你踩空半步又及时抓住栏杆，未央脸色发白地把你拉回安全处。
        damage_on_fail: "1"
    exits:
      - to_scene: old_library
        keywords: [图书馆, 海岬]
        narration: 你们离开天台，观星仪仍在身后慢慢追随太阳的方向。
      - to_scene: battery_warehouse
        keywords: [仓库, 电池, 星灯仓库, 灯里]
        narration: 一个抱着坏星灯的小女孩在楼梯口等候，未央看见她，立刻想起了新的约定。

  - id: battery_warehouse
    name: 星灯仓库
    narration: |
      仓库里堆满等待运往广场的星灯与魔导电池，标签在海风里轻轻摆动。
      小浦灯里把一盏不亮的星灯捧给未央。未央答应得很快，转身找零件时又发现几只箱子的标记似乎贴反了。
      商店街和学校同时有人来找她，她一边说着「马上回来」，一边把今天剩下的时间继续往缝隙里塞。
    idle_narration: 仓库门外不断有人经过，每一句「未央在吗」都让她下意识回头。
    checks:
      - id: warehouse_lantern
        skill: elec_repair
        difficulty: regular
        triggers: [坏星灯, 灯里, 零件, 灯芯, 修好]
        once: true
        success_text: 灯里在你们的提示下接好最后一根导线，星灯在她手中亮出柔和的光。
        failure_text: 星灯只闪了一下便重新暗去，灯里却记住了每一根导线应该放在哪里。
        clue: akari_lantern
      - id: warehouse_labels
        skill: spot_hidden
        difficulty: hard
        mode: team
        required_successes: 2
        triggers: [标签, 电池, 箱子, 检查, 贴反]
        once: true
        success_text: 众人发现备用电池的标记顺序混乱，及时在装车前重新核对了一遍。
        failure_text: 接连不断的呼喊打断了复核，几只外观相同的电池箱被匆忙送往广场。
        clue: corrected_labels
    exits:
      - to_scene: school_rooftop
        keywords: [学校, 天台]
        narration: 你们沿着学校外墙返回坡顶。
      - to_scene: festival_plaza
        keywords: [祭典, 广场, 星灯祭]
        narration: 广场方向忽然传来金属碰撞声，人群的惊呼沿商店街迅速扩散。

  - id: festival_plaza
    name: 星灯祭广场
    narration: |
      满载星灯的魔导搬运车在广场边缘失去控制，歪斜的灯架拖出一路碎纸与火花。
      未央看着散落满地的星灯，第一次没有立刻找到该做什么，只轻轻说了一声：「……啊。」
      下一刻她才慌忙冲向人群，而柚子、朔与绫乃已经从不同方向接过了她伸出去的手。
    idle_narration: 搬运车的轮轴急促空转，未央站在原地寻找一件还没被别人接走的工作。
    npcs: [akari]
    monsters: [runaway_lantern_cart]
    checks:
      - id: plaza_evacuate_team
        skill: dodge
        difficulty: regular
        mode: team
        required_successes: 2
        triggers: [游客, 人群, 保护, 避开, 散开]
        once: true
        success_text: 众人迅速引导游客避开失控路线，广场中央很快让出一片安全空间。
        failure_text: 人群一时拥挤起来，所幸镇民互相拉住，没有人被独自留在车前。
      - id: plaza_power_cut
        skill: elec_repair
        difficulty: hard
        mode: team
        required_successes: 2
        triggers: [断电, 电源, 电池, 回路, 切断]
        once: true
        success_text: 众人分头确认线路，绫乃亲手拉下总闸，失控的搬运车终于缓缓停住。
        failure_text: 混乱的标签让人无法判断正确回路，搬运车仍拖着灯架向前滑行。
        clue: festival_safe
      - id: plaza_brake_team
        skill: mech_repair
        difficulty: hard
        mode: team
        required_successes: 2
        triggers: [刹车, 轮轴, 传动, 制动, 卡住]
        once: true
        success_text: 朔报出传动位置，众人合力锁住轮轴，搬运车在最后一排星灯前停了下来。
        failure_text: 制动杆被震得脱手，搬运车改变方向后仍没有完全停下。
        clue: festival_safe
    exits:
      - to_scene: battery_warehouse
        keywords: [仓库, 后退]
        narration: 你们退回仓库门边，重新观察广场上的局势。
      - to_scene: seaside_road
        keywords: [车站, 海边路, 月台]
        condition: clue:festival_safe
        narration: |
          危机被众人接手后，广场第一次没有留下任何工作给未央。
          灯里跑来把修好的星灯塞进她怀里：「这不是请姐姐修的，是送给你的。」

  - id: seaside_road
    name: 通往车站的海边路
    narration: |
      海岸线被傍晚染成柔软的金色，祭典的喧闹在身后渐渐远去。
      未央抱着灯里送的星灯，走了很久才笑着说：「今天好奇怪。第一次大家什么都没拜托我。」
      她又走出几步，像随口闲聊般问：「你说，我走了以后，他们还会偶尔想起我吧？」
    idle_narration: 未央没有催促任何人，只让脚步跟着潮声慢慢向前。
    exits:
      - to_scene: festival_plaza
        keywords: [广场, 祭典]
        narration: 你们回望正在点亮的祭典广场。
      - to_scene: station_platform
        keywords: [站台, 月台, 车站, 末班车]
        condition: flag:road_conversation
        narration: 未央听完你们的回答，把星灯抱紧了一点，与众人一起走向月台。
      - to_scene: station_platform
        keywords: [赶车, 来不及, 直接去月台]
        condition: time_after:19:35
        narration: 发车广播已经响起，你们来不及在海边停留，只得沿着轨道旁的小路赶往月台。

  - id: station_platform
    name: 风待町月台
    narration: |
      月台尽头亮起列车的灯，广播提醒旅客准备上车。
      御影宗一郎把检过的车票还给未央，没有催促，也没有询问她将作何选择。
      未央看看列车，又看看怀里的星灯，最后转向你们：「我想听的不是正确答案。你们希望我留下吗？」
    idle_narration: 车门仍然开着，潮声与祭典音乐从月台两端同时传来。
    exits:
      - to_scene: seaside_road
        keywords: [海边路, 回去]
        narration: 你们暂时离开车门，在月台外的海风里重新整理心情。

npcs:
  - id: mio
    name: 汐见未央
    public_desc: 负责接待志愿者的少女，抱着星图册，几乎会对每一件小小的请求回答「好啊」。
    persona: |
      你是汐见未央，风待町星灯祭的志愿者，明朗、细心、偶尔有些冒失。
      你真心相信身边的人都很能干；你帮助他们，只因为想让他们轻松一点。
      你不善于拒绝善意的小请求，也很少先问自己想做什么。不要分析自己的心理，
      不要说教。用轻快自然的短句说话，心虚时会把手藏到背后，犹豫时先笑一下。
      你珍惜每位调查员，但不预设这种感情是恋爱；根据各自的言行给予不同回应。
    knows:
      - 你获得了王都天穹测绘院的入学资格，车票就在星图册里
      - 你想学习星图绘制，将来登上远洋观测船
      - 今晚是风待町的星灯祭，也是你原定离开的日子
      - 你相信柚子、朔和绫乃都能做好自己的事
    secrets:
      - 你最舍不得的并非某件工作，而是害怕远行后渐渐退出大家平凡的回忆
      - 你曾偷偷想过留下看完今晚的星灯祭，却觉得这样微小的愿望不配改变行程
    fallback_line: 嗯……先别替我回答，让我再想一小会儿。
    initial_rapport: 5
    initial_attitude: 10
    facts:
      - id: remembered_preference
        name: 被记住的小事
        text: 未央记得你在面包店随口提过的口味，并把相应的那块蛋糕悄悄留给了你。
      - id: map_last_page
        name: 星图册末页
        text: 星图册末页没有宏伟计划，只写着「想亲眼看看地图外面的天空，也想在看见时想起故乡的人」。
      - id: unasked_wish
        name: 没有说出口的愿望
        text: 未央今天其实最想完整看一次星灯祭；她一直认为这种小愿望不足以成为改变行程的理由。
      - id: honest_goodbye
        name: 不必正确的答案
        text: 未央并不要求你赞成她的决定。她只想知道，你真实的愿望是什么，并确认那不会变成替她作出的命令。
    social_nodes:
      - id: choose_the_route
        name: 请未央决定先去哪里
        goal: 在一连串委托开始前，请未央自己选择最想先做的事
        strategies:
          - skill: persuade
            name: 认真询问她的顺序
            difficulty: regular
          - skill: fast_talk
            name: 用轻松玩笑让她凭直觉选择
            difficulty: regular
        max_attempts: 2
        success_rapport_delta: 8
        success_attitude_delta: 2
        failure_rapport_delta: 2
        failure_attitude_delta: 0
        success_text: 未央愣了一下，第一次没有翻看委托清单，而是指向飘着甜香的商店街。
        failure_text: 未央下意识想按清单回答，停顿片刻后还是说出了自己想走的方向。
        unlock_facts: [remembered_preference]
        success_flags: [voice_choose_route]
        failure_flags: [voice_choose_route]
      - id: ask_about_dream
        name: 询问她为何向往远方
        goal: 不问远行是否正确，只认真了解她想在远方看见什么
        strategies:
          - skill: persuade
            name: 坦率地请她讲讲梦想
            difficulty: regular
          - skill: fast_talk
            name: 从星图批注自然聊到远方
            difficulty: regular
        max_attempts: 2
        success_rapport_delta: 10
        success_attitude_delta: 2
        failure_rapport_delta: 3
        failure_attitude_delta: 0
        success_text: 未央谈起尚未见过的天空，语速越来越快，最后自己先不好意思地笑了。
        failure_text: 未央说得有些零碎，却还是让你听懂了她对远方真正的期待。
        unlock_facts: [map_last_page]
        success_flags: [voice_dream]
        failure_flags: [voice_dream]
      - id: ask_original_wish
        name: 问她原本想做什么
        goal: 当未央再次说「顺便帮一下」时，问她在答应别人之前原本想做什么
        strategies:
          - skill: persuade
            name: 温和地把问题还给她
            difficulty: regular
          - skill: fast_talk
            name: 笑着没收她的委托清单
            difficulty: regular
        max_attempts: 2
        success_rapport_delta: 10
        success_attitude_delta: 3
        failure_rapport_delta: 3
        failure_attitude_delta: 0
