<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main class="shell">
    <div class="content">
      <div class="eyebrow">YawnBot · Help</div>
      <h1 class="name" style="margin-top:10px">今天想做什么？</h1>
      <div class="subtitle">只展示你在当前场景真正能使用的功能。</div>
      <section class="help-grid">
        {% for card in cards %}
        <div class="help-card">
          <div class="help-index">0{{ card.index }}</div>
          <div class="help-title">{{ card.title }}</div>
          <div class="help-summary">{{ card.summary }}</div>
          <div class="help-entry">/{{ card.entrypoint }}</div>
        </div>
        {% endfor %}
      </section>
      <div class="actions">回复序号或分类名称继续　·　0 / 取消 / 退出</div>
    </div>
  </main>
</body>
</html>
