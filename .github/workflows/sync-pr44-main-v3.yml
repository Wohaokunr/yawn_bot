name: Sync PR44 with main v3

on:
  push:
    branches:
      - feat/webui-agent-p0-p2
    paths:
      - ".github/workflows/sync-pr44-main-v3.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Merge main and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PR44 Main Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          [[ "$merge_status" -ne 0 ]] || { echo "Expected reviewed conflicts"; exit 1; }

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          expected=(
            "src/plugins/yawn_core/webui/agent_relation_routes.py"
            "webui/src/agent-panels/AgentConfigPanel.tsx"
            "webui/src/agent-panels/PersonaPanel.tsx"
            "webui/src/agent-panels/RelationsPanel.test.tsx"
            "webui/src/agent-panels/RelationsPanel.tsx"
            "webui/src/agent.tsx"
            "webui/src/main.tsx"
          )
          [[ "$(printf '%s\n' "${conflicts[@]}")" == "$(printf '%s\n' "${expected[@]}")" ]] || {
            printf 'Unexpected conflicts:\n%s\n' "${conflicts[*]}"; exit 1;
          }

          # Main relation API semantics + PR44 scoped invalidation.
          git checkout --theirs -- src/plugins/yawn_core/webui/agent_relation_routes.py
          python - <<'PY'
          from pathlib import Path
          p = Path("src/plugins/yawn_core/webui/agent_relation_routes.py")
          s = p.read_text()
          s = s.replace(
              'await hub.notify_change("agent_relation", str(row.id))',
              'await hub.notify_change("agent_relation", str(row.id), group_id=group_id)',
          )
          s = s.replace(
              'await hub.notify_change("agent_relation", str(relation_id))',
              'await hub.notify_change("agent_relation", str(relation_id), group_id=group_id)',
          )
          if s.count('hub.notify_change("agent_relation"') != 3:
              raise SystemExit("unexpected relation notification count")
          p.write_text(s)
          PY

          # Preserve PR44's data-safe draft hydration, cancellable queries, nested IA and lazy panels.
          git checkout --ours -- webui/src/agent-panels/AgentConfigPanel.tsx
          git checkout --ours -- webui/src/agent-panels/PersonaPanel.tsx
          git checkout --ours -- webui/src/agent.tsx

          # PR44 relation lifecycle + main API names + main drawer focus behavior.
          git checkout --ours -- webui/src/agent-panels/RelationsPanel.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path("webui/src/agent-panels/RelationsPanel.tsx")
          s = p.read_text()
          s = s.replace('  App as AntApp,', '  Alert, App as AntApp,', 1)
          for old, new in (
              ("relationCount", "edgeCount"),
              ("memberCount", "linkedMemberCount"),
              ("subjectDisplayName", "subjectName"),
              ("objectDisplayName", "objectName"),
          ):
              s = s.replace(old, new)
          marker = "type RelationListItem = AgentRelationItem & {\n  subjectName?: string;\n  objectName?: string;\n};\n"
          if marker not in s:
              raise SystemExit("relation row marker changed")
          s = s.replace(marker, marker + '''
          function focusDrawerField(selector: string): void {
            window.requestAnimationFrame(() => {
              const target = document.querySelector<HTMLElement>(`${selector} input, ${selector} textarea`);
              target?.focus();
            });
          }
          ''', 1)
          create = '<Drawer open={creating} width={520} title="新增关系边" onClose={() => setCreating(false)}>'
          edit = '<Drawer open={!!editing} width={520} title={`编辑关系边 · ${editing?.type ?? ""}`} onClose={() => setEditing(null)}>'
          if create not in s or edit not in s:
              raise SystemExit("drawer marker changed")
          s = s.replace(create, '''<Drawer
                className="relations-editor-drawer relations-create-drawer"
                open={creating}
                width={520}
                title="新增关系边"
                onClose={() => setCreating(false)}
                afterOpenChange={(open) => { if (open) focusDrawerField(".relations-create-drawer"); }}
              >''', 1)
          s = s.replace(edit, '''<Drawer
                className="relations-editor-drawer relations-edit-drawer"
                open={!!editing}
                width={520}
                title={`编辑关系边 · ${editing?.type ?? ""}`}
                onClose={() => setEditing(null)}
                afterOpenChange={(open) => { if (open) focusDrawerField(".relations-edit-drawer"); }}
              >''', 1)
          edit_form = '<Form form={editForm} layout="vertical" onFinish={saveEdit}>\n'
          if edit_form not in s:
              raise SystemExit("edit form marker changed")
          s = s.replace(edit_form, edit_form + '          <Alert type="info" showIcon className="section-alert" message="类型与两端成员属于边的唯一身份，如需调整请删除后重新新增。" />\n', 1)
          p.write_text(s)
          PY

          # Keep main's original focus regression test unchanged at its original path.
          git checkout --theirs -- webui/src/agent-panels/RelationsPanel.test.tsx
          # Preserve PR44's lazy-graph regression separately, avoiding nested test rewriting.
          git show HEAD:webui/src/agent-panels/RelationsPanel.test.tsx > webui/src/agent-panels/RelationsPanel.lazy.test.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path("webui/src/agent-panels/RelationsPanel.lazy.test.tsx")
          s = p.read_text().replace("relationCount", "edgeCount").replace("memberCount", "linkedMemberCount")
          p.write_text(s)
          PY

          # Both CSS stacks are required: PR interaction/reduced-motion + main layout/design system.
          git checkout --ours -- webui/src/main.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path("webui/src/main.tsx")
          s = p.read_text()
          marker = 'import "./interaction.css";'
          if marker not in s:
              raise SystemExit("interaction.css import missing")
          if 'import "./layout.css";' not in s:
              s = s.replace(marker, marker + '\nimport "./layout.css";\nimport "./design-system.css";', 1)
          p.write_text(s)
          PY

          git add src/plugins/yawn_core/webui/agent_relation_routes.py \
            webui/src/agent-panels/AgentConfigPanel.tsx \
            webui/src/agent-panels/PersonaPanel.tsx \
            webui/src/agent-panels/RelationsPanel.test.tsx \
            webui/src/agent-panels/RelationsPanel.lazy.test.tsx \
            webui/src/agent-panels/RelationsPanel.tsx \
            webui/src/agent.tsx webui/src/main.tsx

          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.lock'
          git diff --check --cached

      - name: Install dependencies
        working-directory: webui
        run: npm ci
      - name: Test
        working-directory: webui
        run: npm test -- --run
      - name: Typecheck
        working-directory: webui
        run: npm run typecheck
      - name: Build
        working-directory: webui
        run: npm run build

      - name: Remove one-shot merge workflows
        shell: bash
        run: |
          git rm .github/workflows/diagnose-pr44-main-merge.yml \
            .github/workflows/sync-pr44-main-v2.yml \
            .github/workflows/sync-pr44-main-v3.yml

      - name: Commit and push merge
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Merge main into feat/webui-agent-p0-p2"
          git push origin HEAD:feat/webui-agent-p0-p2
