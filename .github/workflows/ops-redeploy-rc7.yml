name: One-shot redeploy v0.1.0-rc.7

on:
  push:
    branches:
      - "ops/redeploy-v0.1.0-rc.7-after-control-plane-fix"
    paths:
      - ".github/workflows/ops-redeploy-rc7.yml"

permissions:
  contents: read

env:
  DEPLOY_USER: deploy
  TCR_IMAGE: sgccr.ccs.tencentyun.com/yawn_bot/yawn_bot
  TCR_USERNAME: "100025310087"
  VERSION: v0.1.0-rc.7

jobs:
  redeploy:
    name: Redeploy v0.1.0-rc.7 after control-plane fix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
    concurrency:
      group: yawnbot-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable Tencent TCR release metadata
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-meta"
          asset="yawnbot-${VERSION}-image.txt"
          gh release download "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/release-meta"

          meta="$RUNNER_TEMP/release-meta/$asset"
          test -s "$meta"
          production_release_image="$(sed -n 's/^production_image=//p' "$meta")"
          production_digest="$(sed -n 's/^production_digest=//p' "$meta")"
          commit="$(sed -n 's/^commit=//p' "$meta")"

          [[ "$production_release_image" == "$TCR_IMAGE:$VERSION" ]] || {
            echo "::error::Release production image does not match expected Tencent TCR ref"
            exit 1
          }
          [[ "$production_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Release production digest is invalid"
            exit 1
          }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Release commit SHA is invalid"
            exit 1
          }

          echo "image=$TCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$production_digest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Configure and verify deployment SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/yawnbot-deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/yawnbot-deploy ~/.ssh/known_hosts
          ssh-keygen -yf ~/.ssh/yawnbot-deploy >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts >/dev/null

      - name: Package staged production control plane
        id: control_plane
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/yawnbot-control-plane"
          bootstrap_bundle="$RUNNER_TEMP/yawnbot-control-plane-bootstrap.tar.gz"
          bundle="$RUNNER_TEMP/yawnbot-control-plane.tar.gz"
          rm -rf "$stage" "$bootstrap_bundle" "$bundle"
          mkdir -p "$stage"
          cp deploy/production/compose.yaml "$stage/compose.yaml"
          cp deploy/production/deploy-release.sh "$stage/deploy-release"
          cp deploy/production/deploy-ssh-command "$stage/deploy-ssh-command"
          cp deploy/production/sync-control-plane.sh "$stage/sync-control-plane"
          cp deploy/production/write-deployment-record.py "$stage/write-deployment-record.py"
          tar -czf "$bootstrap_bundle" -C "$stage" \
            compose.yaml deploy-release deploy-ssh-command sync-control-plane
          tar -czf "$bundle" -C "$stage" \
            compose.yaml deploy-release deploy-ssh-command sync-control-plane \
            write-deployment-record.py
          echo "bootstrap_sha256=$(sha256sum "$bootstrap_bundle" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bootstrap_bundle=$bootstrap_bundle" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$bundle" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upgrade and synchronize production control plane
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CONTROL_PLANE_BOOTSTRAP_SHA256: ${{ steps.control_plane.outputs.bootstrap_sha256 }}
          CONTROL_PLANE_BOOTSTRAP_BUNDLE: ${{ steps.control_plane.outputs.bootstrap_bundle }}
          CONTROL_PLANE_SHA256: ${{ steps.control_plane.outputs.sha256 }}
          CONTROL_PLANE_BUNDLE: ${{ steps.control_plane.outputs.bundle }}
        run: |
          set -euo pipefail
          ssh_args=(
            -i ~/.ssh/yawnbot-deploy
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
          )
          cat "$CONTROL_PLANE_BOOTSTRAP_BUNDLE" | \
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/sync-control-plane $CONTROL_PLANE_BOOTSTRAP_SHA256"
          cat "$CONTROL_PLANE_BUNDLE" | \
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/sync-control-plane $CONTROL_PLANE_SHA256"

      - name: Redeploy immutable v0.1.0-rc.7 image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE: ${{ steps.release_meta.outputs.image }}
          DIGEST: ${{ steps.release_meta.outputs.digest }}
          COMMIT: ${{ steps.release_meta.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$TCR_PASSWORD"
          printf '%s\n%s\n' "$TCR_USERNAME" "$TCR_PASSWORD" | \
            ssh -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/deploy-release $IMAGE@$DIGEST $VERSION $COMMIT registry-token-stdin"
