name: Diagnose PR44 main merge

on:
  push:
    branches:
      - feat/webui-agent-p0-p2
    paths:
      - ".github/workflows/diagnose-pr44-main-merge.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attempt three-way merge and print conflicts
        shell: bash
        run: |
          set +e
          git config user.name "PR44 Merge Diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          echo "MERGE_STATUS=$merge_status"
          echo "--- unmerged files ---"
          git diff --name-only --diff-filter=U
          echo "--- status ---"
          git status --short
          echo "--- combined conflict diffs ---"
          for path in $(git diff --name-only --diff-filter=U); do
            echo "===== $path ====="
            git diff --cc -- "$path" || true
          done
          git merge --abort >/dev/null 2>&1 || true
          exit "$merge_status"
