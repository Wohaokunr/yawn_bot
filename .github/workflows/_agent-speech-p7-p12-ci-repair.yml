name: Agent Speech P7-P12 CI Repair

on:
  push:
    branches: [feat/agent-speech-p12]
    paths:
      - scripts/_fix_agent_speech_p7_p12_ci.py
      - .github/workflows/_agent-speech-p7-p12-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-speech-p12
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Apply semantic repairs
        run: uv run --python 3.10 python scripts/_fix_agent_speech_p7_p12_ci.py
      - name: Ruff format and autofix
        run: |
          uv run --python 3.10 ruff format \
            src/plugins/yawn_core/webui/agent.py \
            src/plugins/yawn_core/yawn_agent/activity.py \
            src/plugins/yawn_core/yawn_agent/context_loader.py \
            src/plugins/yawn_core/yawn_agent/dialogue_support.py \
            src/plugins/yawn_core/yawn_agent/outbound.py \
            src/plugins/yawn_core/yawn_agent/speech_finalize.py \
            src/plugins/yawn_core/yawn_agent/speech_runtime.py \
            src/plugins/yawn_core/yawn_agent/tool_result_speech.py \
            src/plugins/yawn_core/yawn_agent/topic_state.py \
            tests/test_agent_speech_p7_p12_completion.py
          uv run --python 3.10 ruff check --fix \
            src/plugins/yawn_core/webui/agent.py \
            src/plugins/yawn_core/yawn_agent/activity.py \
            src/plugins/yawn_core/yawn_agent/context_loader.py \
            src/plugins/yawn_core/yawn_agent/dialogue_support.py \
            src/plugins/yawn_core/yawn_agent/outbound.py \
            src/plugins/yawn_core/yawn_agent/speech_finalize.py \
            src/plugins/yawn_core/yawn_agent/speech_runtime.py \
            src/plugins/yawn_core/yawn_agent/tool_result_speech.py \
            src/plugins/yawn_core/yawn_agent/topic_state.py \
            tests/test_agent_speech_p7_p12_completion.py
      - name: Full Python lint
        run: uv run --python 3.10 ruff check src tests tools/rpg_module_editor tools/rpg_playtest tools/repo_guard.py tools/repository_content_test.py
      - name: Full Python typecheck
        run: uv run --python 3.10 pyright src tools/rpg_module_editor tools/rpg_playtest tools/repo_guard.py tools/repository_content_test.py
      - name: Fast regression suite
        env:
          ENVIRONMENT: prod
          LOCALSTORE_USE_CWD: true
          RPG_AI_ENABLED: false
          WW_AI_ENABLED: false
        run: uv run --python 3.10 pytest -q --ignore=tests/test_webui_spa.py
      - name: Remove temporary repair files
        run: |
          rm scripts/_fix_agent_speech_p7_p12_ci.py
          rm .github/workflows/_agent-speech-p7-p12-ci-repair.yml
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(agent): stabilize speech P7-P12 CI"
          git push origin HEAD:feat/agent-speech-p12
