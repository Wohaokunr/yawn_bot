name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      deploy_production:
        description: "Deploy this release to production after publishing"
        required: false
        default: true
        type: boolean
      skip_quality_gates:
        description: "Skip full CI quality gates and proceed directly to build/deploy (manual runs only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DEPLOY_SSH_KEY_FINGERPRINT: SHA256:PcrAC+GXFS9bBSuK/JLSF602EVaIS2+X2cunjeR2pUY
  DEPLOY_USER: deploy

jobs:
  quality-gates:
    name: Re-run release quality gates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_quality_gates }}
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: quality-gates
    if: >-
      ${{
        always() &&
        (
          needs.quality-gates.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.skip_quality_gates &&
            needs.quality-gates.result == 'skipped'
          )
        )
      }}
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      image: ${{ steps.release_meta.outputs.image }}
      digest: ${{ steps.docker_build.outputs.digest }}
      commit: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Warn when quality gates are manually skipped
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_quality_gates }}
        shell: bash
        run: |
          echo "::warning::Full release quality gates were manually skipped for this deployment."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$version")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $version already exists at $tag_sha, not $GITHUB_SHA"
              exit 1
            fi
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.skip_quality_gates }}" == "true" ]]; then
            quality_gates="skipped-manually"
          else
            quality_gates="passed"
          fi

          repo_lower="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo_lower" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "quality_gates=$quality_gates" >> "$GITHUB_OUTPUT"

      - name: Re-check release checkout content
        run: python tools/repository_content_test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI for deployment package
        working-directory: webui
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Assemble versioned deployment package
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          package_root="release-stage/yawnbot-${VERSION}"
          mkdir -p "$package_root" release-out

          git archive HEAD | tar -x -C "$package_root"
          mkdir -p "$package_root/webui/dist"
          cp -a webui/dist/. "$package_root/webui/dist/"
          printf '%s\n' "$VERSION" > "$package_root/VERSION"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release-stage") / f"yawnbot-{os.environ['VERSION']}"
          manifest = {
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "source": os.environ["GITHUB_REPOSITORY"],
              "webui_prebuilt": True,
              "release_builder": "github-actions-clean-checkout",
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - -C release-stage "yawnbot-${VERSION}" \
            | gzip -n > "release-out/yawnbot-${VERSION}-deploy.tar.gz"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ steps.release_meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.release_meta.outputs.image }}:buildcache,mode=max
          tags: |
            ${{ steps.release_meta.outputs.image }}:${{ steps.release_meta.outputs.version }}
            ${{ steps.release_meta.outputs.image }}:sha-${{ steps.release_meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_meta.outputs.version }}

      - name: Record image digest and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          IMAGE: ${{ steps.release_meta.outputs.image }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          cat > "release-out/yawnbot-${VERSION}-image.txt" <<EOF
          image=${IMAGE}:${VERSION}
          digest=${DIGEST}
          commit=${GITHUB_SHA}
          EOF
          (
            cd release-out
            sha256sum \
              "yawnbot-${VERSION}-deploy.tar.gz" \
              "yawnbot-${VERSION}-image.txt" \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YawnBot ${{ steps.release_meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          body: |
            Docker image: `${{ steps.release_meta.outputs.image }}:${{ steps.release_meta.outputs.version }}`
            Quality gates: `${{ steps.release_meta.outputs.quality_gates }}`

            This release was rebuilt from a clean GitHub Actions checkout. Manual runs may explicitly bypass the full CI quality gates; the status above records whether that happened.
          files: |
            release-out/yawnbot-${{ steps.release_meta.outputs.version }}-deploy.tar.gz
            release-out/yawnbot-${{ steps.release_meta.outputs.version }}-image.txt
            release-out/SHA256SUMS.txt

  deploy-production:
    name: Deploy production
    needs: release
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        (
          !contains(needs.release.outputs.version, '-') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    concurrency:
      group: yawnbot-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure and verify deployment SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/yawnbot-deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/yawnbot-deploy ~/.ssh/known_hosts

          actual_fingerprint="$(ssh-keygen -yf ~/.ssh/yawnbot-deploy | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          echo "GitHub deployment key fingerprint: $actual_fingerprint"
          echo "Expected server-authorized fingerprint: $DEPLOY_SSH_KEY_FINGERPRINT"
          echo "Production SSH user: $DEPLOY_USER"
          if [[ "$actual_fingerprint" != "$DEPLOY_SSH_KEY_FINGERPRINT" ]]; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY does not match the public key installed for the deploy user. Expected $DEPLOY_SSH_KEY_FINGERPRINT, got $actual_fingerprint"
            exit 1
          fi

      - name: Package production control plane
        id: control_plane
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/yawnbot-control-plane"
          bundle="$RUNNER_TEMP/yawnbot-control-plane.tar.gz"
          rm -rf "$stage" "$bundle"
          mkdir -p "$stage"
          cp deploy/production/compose.yaml "$stage/compose.yaml"
          cp deploy/production/deploy-release.sh "$stage/deploy-release"
          cp deploy/production/deploy-ssh-command "$stage/deploy-ssh-command"
          cp deploy/production/sync-control-plane.sh "$stage/sync-control-plane"
          tar -czf "$bundle" -C "$stage" \
            compose.yaml deploy-release deploy-ssh-command sync-control-plane
          sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Synchronize production control plane
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CONTROL_PLANE_SHA256: ${{ steps.control_plane.outputs.sha256 }}
          CONTROL_PLANE_BUNDLE: ${{ steps.control_plane.outputs.bundle }}
        run: |
          set -euo pipefail
          test -s "$CONTROL_PLANE_BUNDLE"
          cat "$CONTROL_PLANE_BUNDLE" | \
            ssh -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/sync-control-plane $CONTROL_PLANE_SHA256"

      - name: Deploy immutable release image
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$GHCR_USERNAME"
          test -n "$GHCR_TOKEN"
          test -n "$DIGEST"
          echo "Starting production deployment. Slow or interrupted GHCR pulls are retried by the production deploy script."
          printf '%s\n%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" | \
            ssh -vv -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/deploy-release $IMAGE@$DIGEST $VERSION $COMMIT github-token-stdin"
