name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      deploy_production:
        description: "Deploy this release to production after publishing"
        required: false
        default: true
        type: boolean
      skip_quality_gates:
        description: "Skip full CI quality gates and proceed directly to build/deploy (manual runs only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  DEPLOY_USER: deploy
  TCR_REGISTRY: sgccr.ccs.tencentyun.com
  TCR_IMAGE: sgccr.ccs.tencentyun.com/yawn_bot/yawn_bot
  TCR_USERNAME: "100025310087"

jobs:
  quality-gates:
    name: Re-run release quality gates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_quality_gates }}
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish release
    needs: quality-gates
    if: >-
      ${{
        always() &&
        (
          needs.quality-gates.result == 'success' ||
          (
            github.event_name == 'workflow_dispatch' &&
            inputs.skip_quality_gates &&
            needs.quality-gates.result == 'skipped'
          )
        )
      }}
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      image: ${{ steps.release_meta.outputs.image }}
      digest: ${{ steps.docker_build.outputs.digest }}
      production_image: ${{ steps.release_meta.outputs.production_image }}
      production_digest: ${{ steps.tcr_meta.outputs.digest }}
      browser_image: ${{ steps.release_meta.outputs.production_image }}
      browser_digest: ${{ steps.browser_final.outputs.digest }}
      browser_tag: ${{ steps.browser_meta.outputs.tag }}
      commit: ${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Warn when quality gates are manually skipped
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_quality_gates }}
        shell: bash
        run: |
          echo "::warning::Full release quality gates were manually skipped for this deployment."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must look like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$version")"
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $version already exists at $tag_sha, not $GITHUB_SHA"
              exit 1
            fi
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.skip_quality_gates }}" == "true" ]]; then
            quality_gates="skipped-manually"
          else
            quality_gates="passed"
          fi

          repo_lower="${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo_lower" >> "$GITHUB_OUTPUT"
          echo "production_image=$TCR_IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "quality_gates=$quality_gates" >> "$GITHUB_OUTPUT"

      - name: Re-check release checkout content
        run: python tools/repository_content_test.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI for deployment package
        working-directory: webui
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Assemble versioned deployment package
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail
          package_root="release-stage/yawnbot-${VERSION}"
          mkdir -p "$package_root" release-out

          git archive HEAD | tar -x -C "$package_root"
          mkdir -p "$package_root/webui/dist"
          cp -a webui/dist/. "$package_root/webui/dist/"
          printf '%s\n' "$VERSION" > "$package_root/VERSION"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("release-stage") / f"yawnbot-{os.environ['VERSION']}"
          manifest = {
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "source": os.environ["GITHUB_REPOSITORY"],
              "webui_prebuilt": True,
              "release_builder": "github-actions-clean-checkout",
          }
          (root / "release-manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - -C release-stage "yawnbot-${VERSION}" \
            | gzip -n > "release-out/yawnbot-${VERSION}-deploy.tar.gz"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ env.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Resolve stable Playwright Chromium runtime
        id: browser_meta
        shell: bash
        env:
          PRODUCTION_IMAGE: ${{ steps.release_meta.outputs.production_image }}
        run: |
          set -euo pipefail
          playwright_version="$(tr -d '\r\n' < deploy/docker/playwright-version.txt)"
          [[ "$playwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Playwright version pin"
            exit 1
          }
          runtime_hash="$(cat deploy/docker/playwright-version.txt deploy/docker/playwright-server.Dockerfile | sha256sum | cut -c1-16)"
          tag="browser-pw-${playwright_version}-${runtime_hash}"
          ref="${PRODUCTION_IMAGE}:${tag}"
          digest="$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}' || true)"
          if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            build=false
            echo "Reusing stable Playwright Chromium runtime: $ref@$digest"
          else
            build=true
            echo "Playwright Chromium runtime is not published yet: $ref"
          fi
          echo "version=$playwright_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build and publish Playwright Chromium runtime
        if: ${{ steps.browser_meta.outputs.build == 'true' }}
        id: browser_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/playwright-server.Dockerfile
          push: true
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ steps.release_meta.outputs.production_image }}:browser-buildcache
          cache-to: type=registry,ref=${{ steps.release_meta.outputs.production_image }}:browser-buildcache,mode=max
          tags: ${{ steps.browser_meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=playwright-${{ steps.browser_meta.outputs.version }}
            io.yawnbot.runtime=playwright-chromium

      - name: Verify stable Playwright Chromium runtime digest
        id: browser_final
        shell: bash
        env:
          BROWSER_REF: ${{ steps.browser_meta.outputs.ref }}
          EXPECTED_DIGEST: ${{ steps.browser_build.outputs.digest }}
          WAS_BUILT: ${{ steps.browser_meta.outputs.build }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$BROWSER_REF" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::TCR did not return a valid Playwright runtime digest"
            exit 1
          }
          if [[ "$WAS_BUILT" == "true" && -n "$EXPECTED_DIGEST" && "$digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Published Playwright runtime digest does not match the build output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish versioned Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          cache-from: type=registry,ref=${{ steps.release_meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.release_meta.outputs.image }}:buildcache,mode=max
          tags: |
            ${{ steps.release_meta.outputs.image }}:${{ steps.release_meta.outputs.version }}
            ${{ steps.release_meta.outputs.image }}:sha-${{ steps.release_meta.outputs.short_sha }}
            ${{ steps.release_meta.outputs.production_image }}:${{ steps.release_meta.outputs.version }}
            ${{ steps.release_meta.outputs.production_image }}:sha-${{ steps.release_meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release_meta.outputs.version }}

      - name: Verify Tencent production mirror digest
        id: tcr_meta
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          PRODUCTION_IMAGE: ${{ steps.release_meta.outputs.production_image }}
          EXPECTED_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="${PRODUCTION_IMAGE}:${VERSION}"
          digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::TCR did not return a valid immutable image digest"
            exit 1
          }
          [[ "$digest" == "$EXPECTED_DIGEST" ]] || {
            echo "::error::TCR mirror digest does not match the GHCR release image"
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Fetch corresponding HTMLKit source archive
        shell: bash
        run: |
          set -euo pipefail
          source_name="nonebot_plugin_htmlkit-0.1.0rc5.tar.gz"
          python - <<'PY'
          import urllib.request

          urllib.request.urlretrieve(
              "https://files.pythonhosted.org/packages/29/79/7f0b60a19132e335cb2d6ec2902e330afc97e82462dc152ae033864acf25/nonebot_plugin_htmlkit-0.1.0rc5.tar.gz",
              "release-out/nonebot_plugin_htmlkit-0.1.0rc5.tar.gz",
          )
          PY
          echo "5c9fc3ed1d1cbf95711006761d19e7a1dc0d0e8b7989c2e806a2bff3aeff7b17  release-out/${source_name}" | sha256sum -c -

      - name: Record image digest and checksums
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          IMAGE: ${{ steps.release_meta.outputs.image }}
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          PRODUCTION_IMAGE: ${{ steps.release_meta.outputs.production_image }}
          PRODUCTION_DIGEST: ${{ steps.tcr_meta.outputs.digest }}
          BROWSER_TAG: ${{ steps.browser_meta.outputs.tag }}
          BROWSER_DIGEST: ${{ steps.browser_final.outputs.digest }}
          PLAYWRIGHT_VERSION: ${{ steps.browser_meta.outputs.version }}
        run: |
          set -euo pipefail
          cat > "release-out/yawnbot-${VERSION}-image.txt" <<EOF
          image=${IMAGE}:${VERSION}
          digest=${DIGEST}
          production_image=${PRODUCTION_IMAGE}:${VERSION}
          production_digest=${PRODUCTION_DIGEST}
          production_browser_image=${PRODUCTION_IMAGE}:${BROWSER_TAG}
          production_browser_digest=${BROWSER_DIGEST}
          playwright_version=${PLAYWRIGHT_VERSION}
          commit=${GITHUB_SHA}
          EOF
          (
            cd release-out
            sha256sum \
              "yawnbot-${VERSION}-deploy.tar.gz" \
              "yawnbot-${VERSION}-image.txt" \
              "nonebot_plugin_htmlkit-0.1.0rc5.tar.gz" \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: YawnBot ${{ steps.release_meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          body: |
            Public Docker image: `${{ steps.release_meta.outputs.image }}:${{ steps.release_meta.outputs.version }}`
            Production TCR mirror: `${{ steps.release_meta.outputs.production_image }}:${{ steps.release_meta.outputs.version }}`
            Stable Chromium runtime: `${{ steps.release_meta.outputs.production_image }}:${{ steps.browser_meta.outputs.tag }}`
            Quality gates: `${{ steps.release_meta.outputs.quality_gates }}`
            This release was rebuilt from a clean GitHub Actions checkout. Manual runs may explicitly bypass the full CI quality gates; the status above records whether that happened.
            Chromium is published separately from the YawnBot application image and is reused until the pinned Playwright/browser runtime inputs change.
            The exact upstream HTMLKit source archive corresponding to the redistributed LGPL native extension is attached to this release and covered by `SHA256SUMS.txt`.
          files: |
            release-out/yawnbot-${{ steps.release_meta.outputs.version }}-deploy.tar.gz
            release-out/yawnbot-${{ steps.release_meta.outputs.version }}-image.txt
            release-out/nonebot_plugin_htmlkit-0.1.0rc5.tar.gz
            release-out/SHA256SUMS.txt

  deploy-production:
    name: Deploy production
    needs: release
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        (
          !contains(needs.release.outputs.version, '-') ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    concurrency:
      group: yawnbot-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure and verify deployment SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_HOST_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/yawnbot-deploy
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/yawnbot-deploy ~/.ssh/known_hosts

          # Validate both key files without printing fingerprints or host metadata.
          ssh-keygen -yf ~/.ssh/yawnbot-deploy >/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts >/dev/null

      - name: Package production control plane
        id: control_plane
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/yawnbot-control-plane"
          bootstrap_bundle="$RUNNER_TEMP/yawnbot-control-plane-bootstrap.tar.gz"
          bundle="$RUNNER_TEMP/yawnbot-control-plane.tar.gz"
          rm -rf "$stage" "$bootstrap_bundle" "$bundle"
          mkdir -p "$stage"
          cp deploy/production/compose.yaml "$stage/compose.yaml"
          cp deploy/production/deploy-release.sh "$stage/deploy-release"
          cp deploy/production/deploy-ssh-command "$stage/deploy-ssh-command"
          cp deploy/production/sync-control-plane.sh "$stage/sync-control-plane"
          cp deploy/production/write-deployment-record.py "$stage/write-deployment-record.py"
          tar -czf "$bootstrap_bundle" -C "$stage" \
            compose.yaml deploy-release deploy-ssh-command sync-control-plane
          tar -czf "$bundle" -C "$stage" \
            compose.yaml deploy-release deploy-ssh-command sync-control-plane \
            write-deployment-record.py
          bootstrap_sha256="$(sha256sum "$bootstrap_bundle" | awk '{print $1}')"
          sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          echo "bootstrap_sha256=$bootstrap_sha256" >> "$GITHUB_OUTPUT"
          echo "bootstrap_bundle=$bootstrap_bundle" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Synchronize production control plane
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CONTROL_PLANE_BOOTSTRAP_SHA256: ${{ steps.control_plane.outputs.bootstrap_sha256 }}
          CONTROL_PLANE_BOOTSTRAP_BUNDLE: ${{ steps.control_plane.outputs.bootstrap_bundle }}
          CONTROL_PLANE_SHA256: ${{ steps.control_plane.outputs.sha256 }}
          CONTROL_PLANE_BUNDLE: ${{ steps.control_plane.outputs.bundle }}
        run: |
          set -euo pipefail
          test -s "$CONTROL_PLANE_BOOTSTRAP_BUNDLE"
          test -s "$CONTROL_PLANE_BUNDLE"
          cat "$CONTROL_PLANE_BOOTSTRAP_BUNDLE" | \
            ssh -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/sync-control-plane $CONTROL_PLANE_BOOTSTRAP_SHA256"
          cat "$CONTROL_PLANE_BUNDLE" | \
            ssh -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/sync-control-plane $CONTROL_PLANE_SHA256"

      - name: Deploy immutable release image from Tencent TCR
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          IMAGE: ${{ needs.release.outputs.production_image }}
          DIGEST: ${{ needs.release.outputs.production_digest }}
          BROWSER_IMAGE: ${{ needs.release.outputs.browser_image }}
          BROWSER_DIGEST: ${{ needs.release.outputs.browser_digest }}
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"
          test -n "$IMAGE"
          test -n "$DIGEST"
          test -n "$BROWSER_IMAGE"
          test -n "$BROWSER_DIGEST"
          echo "Starting production deployment from Tencent TCR immutable application and browser images."
          printf '%s\n%s\n' "$TCR_USERNAME" "$TCR_PASSWORD" | \
            ssh -i ~/.ssh/yawnbot-deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "/opt/yawnbot/bin/deploy-release $IMAGE@$DIGEST $VERSION $COMMIT $BROWSER_IMAGE@$BROWSER_DIGEST registry-token-stdin"
