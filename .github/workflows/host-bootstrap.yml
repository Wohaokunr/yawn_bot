name: Host bootstrap scripts

on:
  push:
    paths:
      - "deploy/host/**"
      - "deploy/napcat/**"
      - "deploy/production/**"
      - ".github/workflows/host-bootstrap.yml"
  pull_request:
    paths:
      - "deploy/host/**"
      - "deploy/napcat/**"
      - "deploy/production/**"
      - ".github/workflows/host-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenCloudOS host scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        shell: bash
        run: |
          bash -n deploy/host/*.sh
          bash -n deploy/production/deploy-release.sh
          bash -n deploy/production/deploy-ssh-command
          bash -n deploy/production/sync-control-plane.sh
      - name: Production bootstrap must fail closed without GitHub deploy key
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if sudo env -u GITHUB_DEPLOY_PUBLIC_KEY \
            bash deploy/host/bootstrap-production-opencloudos9.sh >"$log" 2>&1; then
            cat "$log"
            echo '::error::production bootstrap unexpectedly succeeded without GITHUB_DEPLOY_PUBLIC_KEY'
            exit 1
          fi
          cat "$log"
          grep -Fq 'GITHUB_DEPLOY_PUBLIC_KEY is required for production CD' "$log"
      - name: Ensure no maintainer private state is tracked
        shell: bash
        run: |
          if git ls-files 'deploy/private/**' | grep -q .; then
            echo '::error::deploy/private must never be tracked'
            exit 1
          fi
