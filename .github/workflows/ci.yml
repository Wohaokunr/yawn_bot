name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_fast: ${{ steps.scope.outputs.python_fast }}
      rpg_tool_core: ${{ steps.scope.outputs.rpg_tool_core }}
      rpg_tool_ui: ${{ steps.scope.outputs.rpg_tool_ui }}
      rpg_playtest: ${{ steps.scope.outputs.rpg_playtest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide Python test suites
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          emit_all_suites() {
            echo "python_fast=true" >> "$GITHUB_OUTPUT"
            echo "rpg_tool_core=true" >> "$GITHUB_OUTPUT"
            echo "rpg_tool_ui=true" >> "$GITHUB_OUTPUT"
            echo "rpg_playtest=true" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_call" ]]; then
            emit_all_suites
            echo "Reusable release gate: every Python test suite is required."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            emit_all_suites
            echo "No reliable base SHA: every Python test suite is required."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head")"
          printf '%s\n' "$changed"

          python_fast=false
          rpg_tool_core=false
          rpg_tool_ui=false
          rpg_playtest=false

          while IFS= read -r path; do
            case "$path" in
              pyproject.toml|uv.lock|.github/workflows/ci.yml)
                python_fast=true
                rpg_tool_core=true
                rpg_tool_ui=true
                rpg_playtest=true
                ;;
              src/plugins/yawn_core/yawn_rpg/charsheet.py|src/plugins/yawn_core/yawn_rpg/dice.py|src/plugins/yawn_core/yawn_rpg/module_schema.py|src/plugins/yawn_core/yawn_rpg/modules/*)
                python_fast=true
                rpg_tool_core=true
                rpg_tool_ui=true
                rpg_playtest=true
                ;;
              tools/rpg_module_editor/*)
                rpg_tool_core=true
                rpg_tool_ui=true
                rpg_playtest=true
                ;;
              tools/rpg_playtest/*)
                rpg_playtest=true
                ;;
              src/*|tests/*|data/nonebot_plugin_orm/migrations/*|.env.example|*.py)
                python_fast=true
                ;;
            esac
          done <<< "$changed"

          echo "python_fast=$python_fast" >> "$GITHUB_OUTPUT"
          echo "rpg_tool_core=$rpg_tool_core" >> "$GITHUB_OUTPUT"
          echo "rpg_tool_ui=$rpg_tool_ui" >> "$GITHUB_OUTPUT"
          echo "rpg_playtest=$rpg_playtest" >> "$GITHUB_OUTPUT"
          echo "Selected suites: python_fast=$python_fast rpg_tool_core=$rpg_tool_core rpg_tool_ui=$rpg_tool_ui rpg_playtest=$rpg_playtest"

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Reject generated, runtime, secret or oversized tracked files
        run: python tools/repo_guard.py

      - name: Fresh-checkout repository-content test
        run: python tools/repository_content_test.py

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Ruff
        run: >-
          uv run --python 3.10 ruff check
          src tests tools/rpg_module_editor tools/rpg_playtest
          tools/repo_guard.py tools/repository_content_test.py
      - name: Compile Python sources
        run: >-
          uv run --python 3.10 python -m compileall -q
          src tools/rpg_module_editor tools/rpg_playtest
          tools/repo_guard.py tools/repository_content_test.py

  python-typecheck:
    name: Python typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Pyright
        run: >-
          uv run --python 3.10 pyright
          src tools/rpg_module_editor tools/rpg_playtest
          tools/repo_guard.py tools/repository_content_test.py

  python-fast:
    name: Python fast tests
    needs: change-scope
    if: ${{ needs.change-scope.outputs.python_fast == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Test runtime and plugins without SPA build output
        run: >-
          uv run --python 3.10 pytest -q
          --durations=30 --durations-min=0.05
          --ignore=tests/test_webui_spa.py

  rpg-tool-core:
    name: RPG module editor core tests
    needs: change-scope
    if: ${{ needs.change-scope.outputs.rpg_tool_core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Test editor schema, validation and YAML logic
        run: >-
          uv run --python 3.10 pytest -q
          --durations=30 --durations-min=0.05
          tools/rpg_module_editor/tests/test_validate_lint.py
          tools/rpg_module_editor/tests/test_yaml_io.py

  rpg-tool-ui:
    name: RPG module editor UI tests
    needs: change-scope
    if: ${{ needs.change-scope.outputs.rpg_tool_ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Test Textual editor integration
        run: >-
          uv run --python 3.10 pytest -q
          --durations=30 --durations-min=0.05
          tools/rpg_module_editor/tests/test_app_smoke.py
          tools/rpg_module_editor/tests/test_playtest_tab.py
          tools/rpg_module_editor/tests/test_responsive_references.py
          tools/rpg_module_editor/tests/test_social_features.py

  rpg-playtest-e2e:
    name: RPG playtest regression
    needs: change-scope
    if: ${{ needs.change-scope.outputs.rpg_playtest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Test deterministic RPG simulator and search regressions
        run: >-
          uv run --python 3.10 pytest -q
          --durations=30 --durations-min=0.05
          tools/rpg_playtest/tests

  webui-quality:
    name: WebUI quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload WebUI dist
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 3

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Validate migration graph
        run: uv run --python 3.10 nb orm heads
      - name: Apply migrations on a clean SQLite database
        run: uv run --python 3.10 nb orm upgrade heads
      - name: Detect model/migration drift
        run: uv run --python 3.10 nb orm check

  plugin-smoke:
    name: Plugin smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Load configured plugins
        shell: bash
        run: |
          uv run --python 3.10 python - <<'PY'
          import nonebot

          nonebot.init()
          nonebot.load_from_toml("pyproject.toml")
          required = (
              "yawn_core",
              "yawn_core:yawn_agent",
              "yawn_core:yawn_rpg",
              "yawn_core:yawn_werewolf",
              "yawn_core:yawn_fanqie",
          )
          missing = [name for name in required if nonebot.get_plugin(name) is None]
          if missing:
              raise SystemExit(f"missing configured plugins: {', '.join(missing)}")
          PY

  webui-spa-integration:
    name: WebUI SPA integration
    needs: webui-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - name: Assert frontend artifact exists
        run: test -f webui/dist/index.html
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --all-groups --locked --python 3.10
      - name: Test SPA serving contract
        run: uv run --python 3.10 pytest -q tests/test_webui_spa.py

  clean-install-smoke:
    name: Fresh checkout clean-install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: prod
      LOCALSTORE_USE_CWD: "true"
      RPG_AI_ENABLED: "false"
      WW_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert pristine checkout content
        run: python tools/repository_content_test.py

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Set up Python
        run: uv python install 3.10
      - name: Install Python dependencies from lockfile without shared cache
        run: uv sync --no-cache --all-groups --locked --python 3.10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install WebUI dependencies from lockfile
        working-directory: webui
        env:
          npm_config_cache: ${{ runner.temp }}/npm-clean-install-cache
        run: npm ci --prefer-online
      - name: Build WebUI from source
        working-directory: webui
        run: npm run build

      - name: Prepare minimal runtime configuration
        shell: bash
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          WEBUI_ENABLED=true
          WEBUI_ADMIN_TOKEN=example-clean-install-token-0123456789abcdef
          EOF

      - name: Initialize clean SQLite schema
        run: uv run --python 3.10 nb orm upgrade heads

      - name: Load all required production plugins
        shell: bash
        run: |
          uv run --python 3.10 python - <<'PY'
          import nonebot

          nonebot.init()
          nonebot.load_from_toml("pyproject.toml")
          required = (
              "yawn_core",
              "yawn_core:yawn_agent",
              "yawn_core:yawn_rpg",
              "yawn_core:yawn_werewolf",
              "yawn_core:yawn_fanqie",
          )
          missing = [name for name in required if nonebot.get_plugin(name) is None]
          if missing:
              raise SystemExit(f"missing configured plugins: {', '.join(missing)}")
          PY

      - name: Start application and probe health/WebUI
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/yawnbot-clean-install.log"
          uv run --python 3.10 nb run >"$log_file" 2>&1 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            if curl --fail --silent --show-error \
                --output "${RUNNER_TEMP}/healthz.json" \
                http://127.0.0.1:8080/healthz \
              && curl --fail --silent --show-error \
                --output "${RUNNER_TEMP}/webui.html" \
                http://127.0.0.1:8080/webui; then
              grep -Eqi '<!doctype html|<html' "${RUNNER_TEMP}/webui.html"
              cat "${RUNNER_TEMP}/healthz.json"
              exit 0
            fi
            sleep 2
          done

          cat "$log_file"
          exit 1

  docker-deploy-smoke:
    name: Docker clean-deploy smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare minimal configuration
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config
      - name: Build runtime image
        run: docker compose build
      - name: Start and wait for health
        shell: bash
        run: |
          docker compose up -d
          for _ in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs yawnbot
          exit 1
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs yawnbot
      - name: Stop clean-deploy smoke
        if: always()
        run: docker compose down -v
