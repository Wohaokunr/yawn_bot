name: License compliance

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party_licenses/**"
      - "tools/license_audit.py"
      - "pyproject.toml"
      - "uv.lock"
      - "webui/package.json"
      - "webui/package-lock.json"
      - "deploy/docker/playwright-version.txt"
      - "deploy/docker/playwright-server.Dockerfile"
      - ".github/workflows/license-compliance.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy-existing.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "THIRD_PARTY_NOTICES.md"
      - "third_party_licenses/**"
      - "tools/license_audit.py"
      - "pyproject.toml"
      - "uv.lock"
      - "webui/package.json"
      - "webui/package-lock.json"
      - "deploy/docker/playwright-version.txt"
      - "deploy/docker/playwright-server.Dockerfile"
      - ".github/workflows/license-compliance.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/deploy-existing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-license-payload:
    name: Python runtime license payload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag yawnbot:license-audit .
      - name: Verify top-level notices and LGPL/GPL texts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yawnbot:license-audit -c '
            set -eu
            test -f /app/LICENSE
            test -f /app/THIRD_PARTY_NOTICES.md
            test -f /app/third_party_licenses/README.md
            test -f /app/third_party_licenses/ZCOOL-KuaiLe-OFL-1.1.txt
            test -f /app/third_party_licenses/nonebot-plugin-htmlkit-MIT.txt
            test -f /app/third_party_licenses/litehtml-BSD-3-Clause.txt
            test -f /app/third_party_licenses/nonebot-plugin-htmlkit-native-provenance.md
            test -f /app/third_party_licenses/GPL-3.0.txt
            test -f /app/third_party_licenses/LGPL-3.0.txt
            test -s /app/third_party_licenses/GPL-3.0.txt
            test -s /app/third_party_licenses/LGPL-3.0.txt
            test ! -e /ms-playwright
          '
      - name: Verify corresponding HTMLKit source payload
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yawnbot:license-audit -c '
            set -eu
            source=/app/third_party_sources/nonebot_plugin_htmlkit-0.1.0rc5.tar.gz
            test -s "$source"
            echo "5c9fc3ed1d1cbf95711006761d19e7a1dc0d0e8b7989c2e806a2bff3aeff7b17  $source" | sha256sum -c -
          '
      - name: Audit all Python runtime dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/tools/license_audit.py:/tmp/license_audit.py:ro" \
            --entrypoint python \
            yawnbot:license-audit \
            /tmp/license_audit.py python
      - name: Verify retained Python package license files
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python yawnbot:license-audit - <<'PY'
          from importlib import metadata
          from pathlib import Path

          # These reviewed distributions are expected to retain standalone
          # license files in the installed wheel payload. tqdm==4.70.0 is a
          # documented exception: its reviewed MPL-2.0 AND MIT expression is
          # enforced by tools/license_audit.py, but the wheel has no separate
          # LICENSE/COPYING file.
          for package in ("text-unidecode", "certifi"):
              dist = metadata.distribution(package)
              retained = []
              for entry in dist.files or ():
                  name = Path(str(entry)).name.lower()
                  if not name.startswith(("license", "copying")):
                      continue
                  resolved = Path(dist.locate_file(entry))
                  if resolved.is_file() and resolved.stat().st_size > 0:
                      retained.append(resolved)
              if not retained:
                  raise SystemExit(
                      f"{package}: installed distribution does not retain a "
                      "LICENSE/COPYING file"
                  )

          htmlkit = metadata.distribution("nonebot-plugin-htmlkit")
          package_root = Path(htmlkit.locate_file("nonebot_plugin_htmlkit"))
          if not any(package_root.glob("core*.so")):
              raise SystemExit("nonebot-plugin-htmlkit native core is missing")
          PY

  browser-runtime-licenses:
    name: Playwright Chromium runtime licenses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Chromium sidecar image
        run: >-
          docker build
          --file deploy/docker/playwright-server.Dockerfile
          --tag yawnbot-playwright:license-audit
          .
      - name: Verify Playwright and Chromium license payloads
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh yawnbot-playwright:license-audit -c '
            set -eu
            test -s /usr/local/lib/node_modules/playwright/LICENSE
            test -n "$(find /ms-playwright -type f -name "LICENSE.headless_shell" -print -quit)"
            test -n "$(find /ms-playwright -type f -name "COPYING.LGPLv2.1" -print -quit)"
          '
      - name: Smoke Playwright server and Chromium headless shell
        shell: bash
        run: |
          set -euo pipefail
          name=yawnbot-playwright-smoke
          cleanup() {
            docker logs "$name" 2>/dev/null || true
            docker rm -f "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name "$name" yawnbot-playwright:license-audit >/dev/null
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name")" == "healthy" ]]; then
              break
            fi
            sleep 1
          done
          [[ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$name")" == "healthy" ]]
          docker exec -i "$name" node - <<'NODE'
          const { chromium } = require('/usr/local/lib/node_modules/playwright');
          (async () => {
            const browser = await chromium.connect('ws://127.0.0.1:3000/');
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto('data:text/html,<title>sidecar-ok</title>');
            if (await page.title() !== 'sidecar-ok') {
              throw new Error('unexpected browser smoke title');
            }
            await context.close();
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

  webui-runtime-licenses:
    name: WebUI runtime licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install exact WebUI dependency tree
        working-directory: webui
        run: npm ci
      - name: Reduce to production dependency tree
        working-directory: webui
        run: npm prune --omit=dev
      - name: Audit all WebUI production dependency licenses
        run: python tools/license_audit.py npm webui/node_modules
