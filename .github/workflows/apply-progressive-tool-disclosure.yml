name: Apply progressive tool disclosure patch

on:
  push:
    branches:
      - feat/agent-progressive-tool-disclosure
    paths:
      - .github/workflows/apply-progressive-tool-disclosure.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-progressive-tool-disclosure
          fetch-depth: 0

      - name: Apply progressive disclosure changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path


          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one exact match, got {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")


          def regex_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f"{path}: expected one regex match, got {count}")
              target.write_text(updated, encoding="utf-8")


          router = "src/plugins/yawn_core/yawn_agent/tool_router.py"
          replace_once(
              router,
              '''from .tool_registry import (\n    CONTROLLED_TOOLS,\n    CORE_DIALOGUE_TOOL_NAMES,\n    MESSAGE_SEND_TOOLS,\n    TOOL_DEFINITIONS,\n    TOOL_PERMISSION_CRITICAL,\n    TOOL_PERMISSION_PRIVILEGED,\n    ToolDefinition,\n)''',
              '''from .tool_registry import (\n    CONTROLLED_TOOLS,\n    CORE_DIALOGUE_TOOL_NAMES,\n    MESSAGE_SEND_TOOLS,\n    ToolDefinition,\n)''',
          )
          regex_once(
              router,
              r'''def select_dialogue_tool_names\([\s\S]*?\n    return frozenset\(selected\)\n\n\ndef rank_discoverable_tools''',
              '''def select_dialogue_tool_names(\n    text: str | None,\n    *,\n    has_reply: bool = False,\n    has_mentions: bool = False,\n    has_media: bool = False,\n    allow_admin_tools: bool = False,\n) -> frozenset[str]:\n    \"\"\"Return only the progressive-disclosure bootstrap bundle.\n\n    Business tools are never inferred from user text here. The model starts with\n    the minimal core and must call ``discover_tools`` before any non-core schema\n    is injected. Structural signals still shape message-segment schemas elsewhere,\n    but they do not bypass tool discovery.\n    \"\"\"\n\n    del text, has_reply, has_mentions, has_media, allow_admin_tools\n    return frozenset(CORE_DIALOGUE_TOOL_NAMES)\n\n\ndef rank_discoverable_tools''',
          )
          replace_once(
              router,
              '''    if "discover_tools" in names:\n        return min(MAX_TOOL_ROUNDS, 3)\n    if names & CONTROLLED_TOOLS:\n        return min(MAX_TOOL_ROUNDS, 3)''',
              '''    if "discover_tools" in names:\n        # discover -> execute -> optional supporting tool -> final answer\n        return MAX_TOOL_ROUNDS\n    if names & CONTROLLED_TOOLS:\n        return min(MAX_TOOL_ROUNDS, 3)''',
          )

          registry = "src/plugins/yawn_core/yawn_agent/tool_registry.py"
          replace_once(
              registry,
              '''        keywords=("这条消息", "那条消息", "原消息", "刚才那条"),\n        core=True,\n    ),\n    ToolDefinition(\n        "get_recent_group_messages",''',
              '''        keywords=("这条消息", "那条消息", "原消息", "刚才那条"),\n    ),\n    ToolDefinition(\n        "get_recent_group_messages",''',
          )
          replace_once(
              registry,
              '''    ToolDefinition(\n        "discover_tools",\n        "按任务描述发现当前群、当前权限下可用但尚未加载的工具",\n        {\n            "query": {"type": "string", "minLength": 1, "maxLength": 120},\n            "family": {"type": "string", "minLength": 1, "maxLength": 32},\n            "limit": {"type": "integer", "minimum": 1, "maximum": 8},\n        },\n        required=("query",),''',
              '''    ToolDefinition(\n        "discover_tools",\n        "渐进披露入口：按任务发现可用工具；也可用 family 加载一个工具包。query/family 至少提供一个；发现只加载 schema，不代表动作已执行",\n        {\n            "query": {\n                "type": "string",\n                "minLength": 1,\n                "maxLength": 120,\n                "description": "描述要完成的任务；传‘全部工具’可先查看工具包目录",\n            },\n            "family": {\n                "type": "string",\n                "minLength": 1,\n                "maxLength": 32,\n                "description": "工具包标识；通常来自上一次 discover_tools 返回的 toolpacks.name",\n            },\n            "limit": {"type": "integer", "minimum": 1, "maximum": 12},\n        },''',
          )
          replace_once(
              registry,
              '''        keywords=("记得", "记忆", "以前", "上次", "之前说", "还记不记得"),\n        core=True,\n    ),\n    ToolDefinition(\n        "get_person_profile",''',
              '''        keywords=("记得", "记忆", "以前", "上次", "之前说", "还记不记得"),\n    ),\n    ToolDefinition(\n        "get_person_profile",''',
          )

          prompt = "src/plugins/yawn_core/yawn_agent/prompt.py"
          replace_once(prompt, 'PROMPT_VERSION = "yawn-agent-v13"', 'PROMPT_VERSION = "yawn-agent-v14"')
          regex_once(
              prompt,
              r'''_DISCOVERY_RULES = \(\n[\s\S]*?\n\)\n\n# 稳定层字段''',
              '''_DISCOVERY_RULES = (\n    "工具采用渐进披露：首轮只有最小核心能力。凡需要读取群资料、历史消息、记忆、成员资料、"\n    "表情、文件或执行任何管理动作，都先调用 discover_tools 描述任务，不要猜工具名。"\n    "如果要浏览能力目录，可用 query=‘全部工具’取得紧凑的 toolpacks；"\n    "如果需要某一类完整能力，再把 toolpacks.name 作为 family 调用 discover_tools 加载整包。"\n    "discover_tools 只负责发现并让下一轮注入 schema，不代表任何业务动作已经执行；"\n    "只能调用下一轮实际出现在 schema 中的工具。"\n)\n\n# 稳定层字段''',
          )

          tools = "src/plugins/yawn_core/yawn_agent/tools.py"
          regex_once(
              tools,
              r'''async def _discover_tools_for_actor\([\s\S]*?\n\nasync def _audit\(''',
              '''async def _discover_tools_for_actor(\n    *,\n    query: str,\n    family: str | None,\n    limit: int,\n    bot: Any,\n    group_id: int,\n    actor_user_id: int | None,\n    session: Any,\n    capabilities: BotGroupCapabilities,\n) -> dict[str, Any]:\n    \"\"\"Discover eligible tools without preloading their schemas.\n\n    Privileged discovery is resolved lazily here: ordinary dialogue never pays a\n    role-probe cost, while an administrator asking for a controlled capability\n    gets a live bot-role probe before those tools become discoverable.\n    \"\"\"\n\n    allow_admin_tools = bool(\n        actor_user_id is not None\n        and await user_can_manage_group(bot, group_id, actor_user_id)\n    )\n    effective_capabilities = capabilities\n    if allow_admin_tools:\n        effective_capabilities = await probe_group_capabilities(bot, group_id)\n\n    allowlist: set[str] = set()\n    if session is not None:\n        config = await session.get(GroupAgentConfig, group_id)\n        if config is not None:\n            allowlist = set(config.tool_allowlist or [])\n    resolved_level = _max_tool_permission_level(\n        allow_admin_tools=allow_admin_tools,\n        max_permission_level=None,\n    )\n    candidates: list[_ToolDefinition] = []\n    for definition in _TOOL_DEFINITIONS:\n        exposed, _reason = _tool_exposure_reason(\n            definition,\n            effective_capabilities,\n            allow_admin_tools=allow_admin_tools,\n            max_permission_level=resolved_level,\n            privileged_allowlist=allowlist,\n        )\n        if exposed and definition.discoverable:\n            candidates.append(definition)\n\n    normalized_query = str(query or \"\").strip().casefold()\n    catalog_request = not family and normalized_query in {\n        \"*\",\n        \"全部\",\n        \"全部工具\",\n        \"所有工具\",\n        \"工具目录\",\n        \"工具包\",\n        \"全部工具包\",\n    }\n    matches = (\n        []\n        if catalog_request\n        else rank_discoverable_tools(\n            query,\n            candidates,\n            family=family,\n            limit=limit,\n        )\n    )\n    matched_families = (\n        sorted({item.family for item in candidates})\n        if catalog_request\n        else sorted({item.family for item in matches})\n    )\n    toolpacks: list[dict[str, Any]] = []\n    for pack_name in matched_families:\n        members = [item for item in candidates if item.family == pack_name]\n        if not members:\n            continue\n        toolpacks.append(\n            {\n                \"name\": pack_name,\n                \"count\": len(members),\n                \"summary\": \"；\".join(item.description for item in members[:2])[:240],\n                \"load_with\": {\"family\": pack_name},\n            }\n        )\n    return {\n        \"mode\": \"catalog\" if catalog_request else (\"toolpack\" if family else \"search\"),\n        \"tools\": [\n            {\n                \"name\": item.name,\n                \"description\": item.description,\n                \"family\": item.family,\n                \"permission\": item.permission_level,\n            }\n            for item in matches\n        ],\n        \"toolpacks\": toolpacks,\n        \"count\": len(matches),\n    }\n\n\nasync def _audit(''',
          )
          replace_once(
              tools,
              '''    definition = _TOOL_BY_NAME.get(name)\n    if definition is None:\n        raise ValueError(f"未知工具: {name}")\n    if definition.admin and not capabilities.can_manage:\n        dbg(f"群 {group_id} 工具策略拒绝 {name}: 机器人没有群管理权限")\n        raise PermissionError("机器人没有群管理权限")\n    if definition.owner_only and capabilities.role != "owner":\n        dbg(f"群 {group_id} 工具策略拒绝 {name}: 机器人不是群主")\n        raise PermissionError("该工具需要机器人是群主")\n    if definition.actions and not any(\n        capabilities.has(action) for action in definition.actions\n    ):''',
              '''    definition = _TOOL_BY_NAME.get(name)\n    if definition is None:\n        raise ValueError(f"未知工具: {name}")\n    effective_capabilities = capabilities\n    if name in _CONTROLLED_TOOLS:\n        # Controlled actions re-check the bot role at execution time as well as\n        # discovery time; a stale discovery can never grant a lasting privilege.\n        effective_capabilities = await probe_group_capabilities(\n            bot, group_id, refresh=True\n        )\n    if definition.admin and not effective_capabilities.can_manage:\n        dbg(f"群 {group_id} 工具策略拒绝 {name}: 机器人没有群管理权限")\n        raise PermissionError("机器人没有群管理权限")\n    if definition.owner_only and effective_capabilities.role != "owner":\n        dbg(f"群 {group_id} 工具策略拒绝 {name}: 机器人不是群主")\n        raise PermissionError("该工具需要机器人是群主")\n    if definition.actions and not any(\n        effective_capabilities.has(action) for action in definition.actions\n    ):''',
          )
          replace_once(
              tools,
              '''        if name == "discover_tools":\n            query = str(args.get("query") or "").strip()\n            if not query:\n                raise ValueError("query 不能为空")\n            family = str(args.get("family") or "").strip() or None\n            limit = _tool_result_limit(args, default=5, maximum=8)''',
              '''        if name == "discover_tools":\n            query = str(args.get("query") or "").strip()\n            family = str(args.get("family") or "").strip() or None\n            if not query and not family:\n                raise ValueError("query 和 family 至少提供一个")\n            if not query:\n                query = str(family)\n            limit = _tool_result_limit(\n                args, default=(12 if family else 5), maximum=12\n            )''',
          )

          dialogue = "src/plugins/yawn_core/yawn_agent/dialogue.py"
          regex_once(
              dialogue,
              r'''async def _resolve_turn_tool_capabilities\([\s\S]*?\n\ndef _accumulate_turn_usage''',
              '''async def _resolve_turn_tool_capabilities(\n    bot: Bot,\n    group_id: int,\n    actor_user_id: int,\n    tool_intent_text: str,\n    *,\n    has_reply: bool,\n    has_mentions: bool,\n    has_media: bool,\n) -> tuple[BotGroupCapabilities, bool, frozenset[str], str]:\n    \"\"\"Return the minimal first-round capability bundle.\n\n    Progressive disclosure deliberately avoids actor/bot role probes before the\n    model asks for a non-core capability. ``discover_tools`` performs permission\n    resolution lazily, and only discovered privileged tools trigger a live bot\n    capability upgrade for the next LLM round.\n    \"\"\"\n\n    del actor_user_id\n    baseline = local_group_capabilities(bot)\n    bootstrap_names = select_dialogue_tool_names(\n        tool_intent_text,\n        has_reply=has_reply,\n        has_mentions=has_mentions,\n        has_media=has_media,\n        allow_admin_tools=False,\n    )\n    return baseline, False, bootstrap_names, \"progressive_bootstrap\"\n\n\ndef _accumulate_turn_usage''',
          )
          replace_once(
              dialogue,
              '''                discovered_tool_names: set[str] = set()\n                for call in tool_calls:''',
              '''                discovered_tool_names: set[str] = set()\n                discovered_requires_admin = False\n                for call in tool_calls:''',
          )
          replace_once(
              dialogue,
              '''                        for item in discovery_rows:\n                            if isinstance(item, dict) and item.get("name"):\n                                discovered_tool_names.add(str(item["name"]))''',
              '''                        for item in discovery_rows:\n                            if isinstance(item, dict) and item.get("name"):\n                                discovered_tool_names.add(str(item["name"]))\n                                if str(item.get("permission") or "") in {\n                                    "privileged",\n                                    "critical",\n                                }:\n                                    discovered_requires_admin = True''',
          )
          replace_once(
              dialogue,
              '''                if discovered_tool_names and not round_sent_message:\n                    selected_tool_names = frozenset(''',
              '''                if discovered_tool_names and not round_sent_message:\n                    if discovered_requires_admin:\n                        # The trusted discovery result only contains privileged\n                        # rows after actor permission and bot role were validated.\n                        # Re-read the cached/live bot capability object so the\n                        # discovered schema can be injected for the next round.\n                        capabilities = await probe_group_capabilities(bot, group_id)\n                        allow_admin_tools = True\n                        capability_source = "progressive_discovery_live_probe"\n                    selected_tool_names = frozenset(''',
          )
          replace_once(
              dialogue,
              '''                            "tool_count": len(tools),\n                            "round_limit": round_limit,''',
              '''                            "tool_count": len(tools),\n                            "round_limit": round_limit,\n                            "capability_source": capability_source,''',
          )

          tests = "tests/test_agent_security.py"
          replace_once(
              tests,
              '''    assert source == "local_baseline"\n    assert allow_admin is False\n    assert caps == capabilities.local_group_capabilities(Bot())\n    assert "get_group_info" in tool_names''',
              '''    assert source == "progressive_bootstrap"\n    assert allow_admin is False\n    assert caps == capabilities.local_group_capabilities(Bot())\n    assert tool_names == frozenset({"send_message", "discover_tools"})''',
          )
          regex_once(
              tests,
              r'''    core = frozenset\(\n        \{"send_message", "search_group_memory", "get_message", "discover_tools"\}\n    \)\n[\s\S]*?    assert \{"send_message", "search_reactions"\} <= reaction_bundle''',
              '''    core = frozenset({"send_message", "discover_tools"})\n    assert tools.select_dialogue_tool_names("今天有点困") == core\n    reply_bundle = tools.select_dialogue_tool_names(\n        "今天有点困", has_reply=True, has_media=True\n    )\n    assert reply_bundle == core\n    mention_bundle = tools.select_dialogue_tool_names("你好", has_mentions=True)\n    assert mention_bundle == core\n    memory_bundle = tools.select_dialogue_tool_names("你还记得我上次说的吗")\n    assert memory_bundle == core\n    reaction_bundle = tools.select_dialogue_tool_names("发个无语表情包")\n    assert reaction_bundle == core''',
          )
          replace_once(
              tests,
              '''    assert (\n        tools.dialogue_tool_round_limit({"discover_tools", "send_message"})\n        == EXTENDED_TOOL_ROUNDS\n    )''',
              '''    assert (\n        tools.dialogue_tool_round_limit({"discover_tools", "send_message"})\n        == tools.MAX_TOOL_ROUNDS\n    )''',
          )
          replace_once(
              tests,
              '''    discovered = {item["name"] for item in result["result"]["tools"]}\n    assert "set_essence_message" in discovered''',
              '''    discovered = {item["name"] for item in result["result"]["tools"]}\n    packs = {item["name"]: item for item in result["result"]["toolpacks"]}\n    assert "essence" in packs\n    assert packs["essence"]["load_with"] == {"family": "essence"}\n    assert "set_essence_message" in discovered''',
          )

          speech_tests = "tests/test_agent_speech_p6_p8.py"
          replace_once(
              speech_tests,
              '''    tools = select_dialogue_tool_names("这个呢", has_reply=True)\n    assert {"send_message", "search_reactions", "react_to_message"} <= tools''',
              '''    tools = select_dialogue_tool_names("这个呢", has_reply=True)\n    assert tools == frozenset({"send_message", "discover_tools"})''',
          )

          workflow = Path(".github/workflows/apply-progressive-tool-disclosure.yml")
          workflow.unlink()
          PY

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(agent): enforce progressive tool disclosure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
