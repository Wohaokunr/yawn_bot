name: PR44 scope safety hardening

on:
  push:
    branches:
      - feat/webui-agent-p0-p2
    paths:
      - .github/workflows/pr44-p3-p5-scope-fix.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/webui-agent-p0-p2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Apply strict group scope and stale-mutation migration
        run: python tools/pr44_scope_fix.py
      - name: Verify backend scope contract
        run: |
          uv sync --all-groups --locked --python 3.10
          uv run --python 3.10 pytest -q tests/test_webui_hub.py
          uv run --python 3.10 ruff check src/plugins/yawn_core/webui tests/test_webui_hub.py
      - name: Verify high-risk WebUI regressions
        working-directory: webui
        run: |
          npm ci --prefer-offline
          npm test -- --run src/shared.test.tsx src/agent-panels/AgentConfigPanel.test.tsx src/agent-panels/AgentMessagesPanel.test.tsx src/agent-detail-regression.test.tsx src/agent-panels/RelationsPanel.test.tsx src/agent-panels/RelationsPanel.lazy.test.tsx
          npm run typecheck
          npm run build
      - name: Commit hardened safety contract and remove temporary helpers
        run: |
          rm .github/workflows/pr44-p3-p5-scope-fix.yml tools/pr44_scope_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(webui): harden scoped invalidation and stale mutations"
          git push origin HEAD:feat/webui-agent-p0-p2
